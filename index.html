<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SystemDesignBeforeMinutes — System Design, Explained</title>
<meta name="description" content="A complete system design course in plain language: fundamentals, databases, caching, CDNs, APIs, distributed systems, trade-offs, HLD and LLD case studies, design patterns and rapid revision." />
<link rel="icon" href="icon.svg" type="image/svg+xml" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<meta name="theme-color" content="#0c1220" />
<link rel="stylesheet" href="css/styles.css" />
<script>
  // Apply the saved theme and text size before first paint, so there is no flash.
  try {
    var t = localStorage.getItem('sd.theme'); if (t) document.documentElement.dataset.theme = JSON.parse(t);
    var s = localStorage.getItem('sd.size'); if (s) document.documentElement.style.setProperty('--fs', JSON.parse(s) + 'px');
  } catch (e) {}
</script>
</head>
<body>

<div class="read-progress" id="readProgress"></div>

<header class="topbar">
  <button class="icon-btn menu-toggle" id="menuToggle" aria-label="Open course menu" aria-expanded="false" aria-controls="sidebar">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
  </button>

  <a class="brand" href="#/" aria-label="Home">
    <span class="brand-mark" aria-hidden="true">
      <svg viewBox="0 0 32 32"><rect x="3" y="3" width="10" height="10" rx="2"/><rect x="19" y="3" width="10" height="10" rx="2"/><rect x="11" y="19" width="10" height="10" rx="2"/><path d="M8 13v3h16v-3M16 16v3"/></svg>
    </span>
    <span class="brand-text"><strong>SystemDesign<em>BeforeMinutes</em></strong><small>System design, explained</small></span>
  </a>

  <div class="search-wrap" role="search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input type="search" id="search" placeholder="Search every lesson…" autocomplete="off" spellcheck="false" aria-label="Search lessons" aria-controls="searchResults" />
    <kbd class="kbd-hint">Ctrl K</kbd>
    <div class="search-results" id="searchResults" role="listbox" hidden></div>
  </div>

  <div class="top-actions">
    <button class="icon-btn" id="sizeDown" aria-label="Smaller text" title="Smaller text"><span class="aa small">A</span></button>
    <button class="icon-btn" id="sizeUp" aria-label="Larger text" title="Larger text"><span class="aa">A</span></button>
    <button class="icon-btn" id="themeToggle" aria-label="Toggle dark mode" title="Toggle theme">
      <svg class="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
    </button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar" aria-label="Course contents">
    <div class="side-progress">
      <div class="ring" id="sideRing" style="--p:0"><span id="sidePct">0%</span></div>
      <div><strong>Your progress</strong><small id="sideCount">0 lessons done</small></div>
    </div>
    <nav id="nav" class="nav"></nav>
    <div class="side-foot"><button class="ghost-btn" id="resetProgress">Reset progress</button></div>
  </aside>
  <div class="scrim" id="scrim"></div>

  <main class="main" id="main">
    <div id="view" class="view"></div>
    <footer class="site-foot">
      <p>Written and maintained by <a href="https://github.com/vivekkumarq" target="_blank" rel="noopener">Vivek Kumar</a> · also see <a href="https://interviewprepbeforeminutes.duckdns.org/" target="_blank" rel="noopener">InterviewPrepBeforeMinutes</a> and <a href="https://algocircle.duckdns.org/" target="_blank" rel="noopener">AlgoCircle</a></p>
      <p class="muted">Keys: <kbd>Ctrl K</kbd> search · <kbd>←</kbd> <kbd>→</kbd> previous / next lesson</p>
    </footer>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="js/course.js"></script>
<script src="js/app.js"></script>
</body>
</html>
